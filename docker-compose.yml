services:
  postgres:
    image: postgres:16-alpine
    container_name: quiz-builder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quiz_builder
      POSTGRES_USER: quiz_builder
      POSTGRES_PASSWORD: quiz_builder
    ports:
      - "5432:5432"
    volumes:
      - quiz-builder-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz_builder -d quiz_builder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quiz-builder-pgdata:
